# ~/.zeroclaw/config.toml — minimal reproducible config for TAPE on ZeroClaw v0.8.3.
# This is the annotated skeleton; a real config also carries the defaults `zeroclaw
# config migrate` fills in. Secrets are redacted — never commit a real key.
#
# CUSTODY: the agent holds ONE hot key that, THROUGH THIS PROCESS, can only write
# {Memo, ComputeBudget} transactions — enforced in lib/signing-policy.js, not by convention.
#
# This comment used to read "it never holds user funds and never signs a transfer or a swap."
# That was checked on 2026-07-31 and was false in three ways: the key holds real mainnet SOL,
# it HAS signed a SOL transfer, and it is shared with two sibling projects. The retraction is
# in SUBMISSION.md; leaving the comforting version in the file an operator actually copies
# would have re-published a claim the write-up had already withdrawn.
#
# What the gate buys: THIS process cannot spend the balance. What it does not buy: custody —
# any process that can read the keypair file bypasses the gate entirely, and `allowed_commands`
# below includes `node`. Keep the balance small on purpose. See THREAT-MODEL.md D3.

schema_version = 3

# --- provider -------------------------------------------------------------------
# Any ZeroClaw-supported provider works; the ANCHOR path uses no model at all, so this
# only has to be good enough for the chat-facing agent.
#
# MEASURED, because "any provider works" is the kind of sentence that quietly isn't true:
# posting one call is ~8 model calls (menu, then the post, then the anchor). On Gemini's
# free tier that fits inside the 20-request-per-minute quota exactly once, and a second
# take inside the same minute fails. It also mapped arguments worse — it left `lane` and
# `size` empty where DeepSeek filled both from the menu's own output.
[providers.models.openrouter.default]
api_key = "<OPENROUTER_API_KEY>"
model = "deepseek/deepseek-chat"
# Cross-provider fallback: each alias resolves with its OWN key and endpoint, so a dead
# balance on one does not take the agent down. Ordered, tried after this alias's models.
fallback = ["gemini.default"]

[providers.models.gemini.default]
api_key = "<GEMINI_API_KEY>"
model = "gemini-2.5-flash"

# --- skill bundle ---------------------------------------------------------------
# Resolves to ~/.zeroclaw/shared/skills/tape/. Provides tape_markets/post/anchor/receipt/verify.
[skill_bundles.tape]

[skills]
allow_scripts = false   # tools call `node` directly; no shell scripts on disk to audit

# --- SOP (agent-facing deterministic pipeline) ----------------------------------
[sop]
sops_dir = "/home/ubuntu/.zeroclaw/data/sops"
maintenance_interval_secs = 60          # non-zero REQUIRED or in-SOP cron never fires
default_execution_mode = "deterministic"

# --- interval anchoring: a SHELL cron job, NOT the SOP's own trigger ------------
# A SOP run needs a live agent loop to execute its steps; a channel-less daemon has
# none, so the run stalls and (max_concurrent=1) its lease swallows the next tick.
# The anchor pipeline must never depend on a model being reachable or a quota unspent.
[cron.tape-anchor]
name = "TAPE interval anchor"
job_type = "shell"
command = "node /ABSOLUTE/PATH/tape/bin/daemon.js --once"
enabled = true
[cron.tape-anchor.schedule]
kind = "cron"
# Must match the live job. This read */15 while production ran */5, which mattered more than
# a stale comment usually does: the write-up invites the reader to check that anchors land on
# the five-minute grid, and a reader who reproduced from THIS file would have generated a tape
# that failed our own invited check and looked like we had lied about the cutover.
expr = "*/5 * * * *"
tz = "UTC"

# --- channel --------------------------------------------------------------------
[channels.telegram.tape]
enabled = true                          # defaults false on purpose
bot_token = "<TELEGRAM_BOT_TOKEN>"

# --- narrow risk profile --------------------------------------------------------
# Deliberately tight, not "supervised off". One binary, two roots, five auto-approved
# tools. HONEST LIMIT: allowed_roots constrains ZeroClaw's OWN file tools, NOT a child
# `node` process — that runs as the host user and can read the anchor key.
#
# This comment used to end "the real containment is that a memo-only T1 key holds nothing
# worth stealing." That was false and SUBMISSION.md retracts it: on 2026-07-31 we checked
# the key instead of the sentence and found ~0.081 SOL of real mainnet SOL, a SOL transfer
# it had already signed, and two other projects sharing it. The retraction shipped while
# this line kept asserting the original claim — so the write-up said "we say this in the
# config comment too" and the config comment said the opposite.
#
# The honest statement: a child process that can read the keypair file is OUTSIDE the
# signing gate, so residual exposure is the key's balance, kept small on purpose and now
# capped per day on the anchoring path. A dedicated TAPE-only key whose material never
# sits readable on disk is the actual fix, and it is open work, not a solved problem.
[risk_profiles.tape]
level = "supervised"
workspace_only = false
allowed_commands = ["node"]
allowed_roots = ["/ABSOLUTE/PATH/projects/tape", "/tmp"]
auto_approve = ["tape__tape_markets", "tape__tape_post", "tape__tape_anchor", "tape__tape_receipt", "tape__tape_verify"]
require_approval_for_medium_risk = false
block_high_risk_commands = true

# --- agent ----------------------------------------------------------------------
[agents.tape]
enabled = true
model_provider = "openrouter.default"
risk_profile = "tape"
channels = ["telegram.tape"]
skill_bundles = ["tape"]
cron_jobs = ["tape-anchor"]
